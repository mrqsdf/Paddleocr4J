
name: Synchronisation Wiki

on:
  push:
    branches:
      - master
    paths:
      - 'wiki/**'
      - '.github/workflows/sync-wiki.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: true

jobs:
  sync-wiki:
    name: Publier le Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Synchroniser le Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki/
          strategy: clone
          preprocess: false
          disable-empty-commits: true
          commit-message: "docs: synchronisation automatique du Wiki"
